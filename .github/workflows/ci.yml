name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4      # Pyodide 스모크 테스트용 (뷰어 실행 경로 검증)
        with:
          node-version: "20"
      - run: npm install                 # pyodide (tests/pyodide_smoke.mjs)
      - run: pip install -e ".[dev]"
      - run: python -m pytest tests/ -q
      - name: examples smoke test
        run: |
          python examples/ex1_pi_closed_loop.py
          python examples/ex2_pendulum_pyfunction.py
          python examples/ex3_subsystem.py
          python examples/ex4_discrete_pi.py

  # 배포 wheel 검증 — "배포 ≠ 저장소" 방지 (UX 리뷰 차단 항목 5).
  # sdist/wheel 을 빌드하고 별도 venv 에 wheel 을 설치해 CLI/데모/시뮬을 검사.
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python tools/check_wheel.py
