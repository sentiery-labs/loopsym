[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "loopsym"
version = "0.1.0"
description = "Visual block-diagram simulation for control systems and robotics"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Sentiery" }]
keywords = ["simulation", "block-diagram", "control-systems", "drone", "education", "px4"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Education",
    "Topic :: Scientific/Engineering",
]
dependencies = []            # 코어는 순수 파이썬 — 의존성 0 (교육용 설계 원칙)

[project.scripts]
loopsym = "loopsym.__main__:main"    # `loopsym [model.json]` → 독립 앱 창

[project.optional-dependencies]
examples = ["matplotlib"]
server = ["fastapi", "uvicorn"]          # 로컬 서버 모드 (python -m loopsym.server)
dev = ["pytest", "matplotlib", "fastapi", "uvicorn", "websockets"]

[tool.setuptools]
packages = ["loopsym"]

[tool.setuptools.package-data]
loopsym = ["viewer.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
