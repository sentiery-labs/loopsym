[build-system]
# >=64: PEP 660 editable install (build_editable 훅) — 61 이면 setup.py 없는
# 프로젝트의 `pip install -e .` 가 구형 환경에서 실패한다 (Codex P41 판정 #1)
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "loopsym"
version = "0.1.1"
description = "Visual block-diagram simulation for control systems and robotics"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Sentiery" }]
keywords = ["simulation", "block-diagram", "control-systems", "drone", "education", "px4"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Education",
    "Topic :: Scientific/Engineering",
]
dependencies = []            # 코어는 순수 파이썬 — 의존성 0 (교육용 설계 원칙)

[project.urls]
Repository = "https://github.com/sentiery-labs/loopsym"
Issues = "https://github.com/sentiery-labs/loopsym/issues"
Changelog = "https://github.com/sentiery-labs/loopsym/blob/main/CHANGELOG.md"

[project.scripts]
loopsym = "loopsym.__main__:main"    # `loopsym [model.json]` → 독립 앱 창

[project.optional-dependencies]
examples = ["matplotlib"]
server = ["fastapi", "uvicorn"]          # 로컬 서버 모드 (python -m loopsym.server)
mavlink = ["pymavlink"]                  # MavlinkHil 블록 (PX4 SITL/HITL)
dev = ["pytest", "matplotlib", "fastapi", "uvicorn", "websockets"]

[tool.setuptools]
packages = ["loopsym"]

[tool.setuptools.package-data]
loopsym = ["viewer.html", "examples/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
